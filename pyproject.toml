[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lecture-dub"
version = "0.1.0"
description = "Create timestamp-aligned Korean lecture audio from translated WebVTT subtitles."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "HyunKN" }]
dependencies = [
  "edge-tts>=7.2.8,<8",
  "yt-dlp>=2025.1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
local-qwen = ["qwen-tts>=0.1.1,<0.2"]
local-supertonic = ["supertonic>=1.2.2,<2"]
local = [
  "qwen-tts>=0.1.1,<0.2",
  "supertonic>=1.2.2,<2",
]

[project.scripts]
lecture-dub = "lecture_dub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lecture_dub"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
